# ============================================================================
# 这两行必须放在 nginx.conf 的 http { } 里（不能放 server / location 里）。
#
# 1Panel 入口：左侧「网站」→ 顶部「配置」（部分版本叫「全局配置」/「OpenResty 配置」）
#              → 编辑主配置 nginx.conf → 加到 http { ... } 内 → 保存。
# 找不到入口就跳过限流（不影响部署），改成强密码 + SSH 限制即可。
# ============================================================================

# 每个来源 IP 每分钟 10 次登录请求；超过返回 429
limit_req_zone $binary_remote_addr zone=webstack_login:10m rate=10r/m;
limit_req_status 429;

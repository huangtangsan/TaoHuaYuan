# ============================================================================
# 粘到 1Panel「网站 → 你的站点 → 配置文件」里 server { ... } 的内部，保存即热加载。
# 1Panel 生成的反向代理配置默认已包含 location ^~ / { proxy_pass ...; }，
# 下面这几段是补丁，不要整段替换原有配置。
# ============================================================================

# 图标上传走 JSON（base64），10 MB 足够；默认 1 MB 会直接 413
# 注意：如果本段上方已有 client_max_body_size，请直接改它的值，不要重复添加
#       —— nginx 同层级重复指令会报 "duplicate"，reload 失败站点就挂了。
client_max_body_size 10m;

# ---- 基础安全响应头（对所有响应生效）----
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# ---- 登录接口限流：每 IP 每分钟 10 次，突发 5 次 ----
# 需要先在 nginx.conf 的 http {} 里定义 webstack_login 这个 zone，
# 见 deploy/nginx/http-limit-zone.conf；没定义就别加这一段，否则 nginx 起不来。
location = /api/login {
    limit_req zone=webstack_login burst=5 nodelay;
    proxy_pass http://webstack:8300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- 后台仪表盘是 SSE 长连接，必须关缓冲，否则前端曲线不动 ----
location = /api/admin/dashboard {
    proxy_pass http://webstack:8300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
}

# ---- 可选：OpenResty 已经在 host 网络、代理地址写的是 127.0.0.1 时，
#      把上面两段的 proxy_pass 都改成 http://127.0.0.1:8300; ----
